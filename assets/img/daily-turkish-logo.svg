<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Daily Turkish</title>
  <desc id="desc">An open book with a red crescent and star, beside the Daily Turkish wordmark.</desc>

  <g aria-hidden="true">
    <circle cx="90" cy="90" r="76" fill="#e34b4f"/>

    <!-- Crescent and star -->
    <circle cx="76" cy="55" r="17" fill="#fff"/>
    <circle cx="83" cy="49" r="16" fill="#e34b4f"/>
    <path d="m105 42 3.3 6.6 7.3 1.1-5.3 5.1 1.2 7.2-6.5-3.4-6.5 3.4 1.2-7.2-5.3-5.1 7.3-1.1z" fill="#fff"/>

    <!-- Open book -->
    <path d="M31 83c17-7 37-5 57 7v46c-20-12-40-14-57-7z" fill="#fff"/>
    <path d="M89 90c20-12 40-14 57-7v46c-17-7-37-5-57 7z" fill="#fff"/>
    <path d="M89 90v46" fill="none" stroke="#f4b7ba" stroke-linecap="round" stroke-width="3"/>
    <path d="M40 94c12-3 25-1 37 4M40 106c12-3 25-1 37 4M102 98c12-5 25-7 37-4M102 110c12-5 25-7 37-4" fill="none" stroke="#f4b7ba" stroke-linecap="round" stroke-width="2.5"/>
  </g>

  <text x="194" y="112" fill="#e34b4f" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="560" letter-spacing="-2.5">Daily</text>
  <text x="350" y="112" fill="#242424" style="fill:#242424" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="720" letter-spacing="-2.5">Turkish</text>
</svg>
