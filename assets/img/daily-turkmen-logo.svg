<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Daily Turkmen</title>
  <desc id="desc">An open book under a carpet göl, beside the Daily Turkmen wordmark.</desc>

  <g aria-hidden="true">
    <circle cx="90" cy="90" r="76" fill="#167a55"/>

    <!-- Carpet göl: an octagon quartered, with a diamond at its heart -->
    <path d="M71 34h38l14 13v18l-14 13H71L57 65V47z" fill="#fff"/>
    <path d="M90 34v44M57 56h66" fill="none" stroke="#a8d5c0" stroke-width="2.5"/>
    <path d="M90 43l13 13-13 13-13-13z" fill="#b23a2e"/>
    <path d="M90 50l6 6-6 6-6-6z" fill="#fff"/>

    <!-- Open book -->
    <path d="M31 89c17-7 37-5 57 7v42c-20-12-40-14-57-7z" fill="#fff"/>
    <path d="M89 96c20-12 40-14 57-7v42c-17-7-37-5-57 7z" fill="#fff"/>
    <path d="M89 96v42" fill="none" stroke="#a8d5c0" stroke-linecap="round" stroke-width="3"/>
    <path d="M40 100c12-3 25-1 37 4M40 112c12-3 25-1 37 4M102 104c12-5 25-7 37-4M102 116c12-5 25-7 37-4" fill="none" stroke="#a8d5c0" stroke-linecap="round" stroke-width="2.5"/>
  </g>

  <text x="194" y="112" fill="#167a55" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="560" letter-spacing="-2.5">Daily</text>
  <text x="350" y="112" fill="#242424" style="fill:#242424" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="720" letter-spacing="-2.5">Turkmen</text>
</svg>
