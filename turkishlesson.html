        background: rgb(255 255 255 / .6); -webkit-backdrop-filter: var(--at-blur); backdrop-filter: var(--at-blur);

      .at-hdr .at-home { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-left: -4px; padding: 4px; border-radius: 10px; white-space: nowrap; }

    <style>
      /* Lesson player: the hub's tokens (turkish.html), a single centred column, the answer dock pinned to the bottom. */
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        --paper: #fff; --ink: #242424; --body: #555; --muted: #6f6f6f; --faint: #b5b5b0;
        --blue: #287a9e; --blue-dark: #155b7c; --blue-wash: rgb(40 122 158 / 11%); --blue-tint: rgb(40 122 158 / 5%);
        --line: #e4e3df; --panel: #fafaf8; --warm: #b35a12; --warm-wash: rgb(196 106 27 / 10%); --danger: #a3261b;
        --ok: #2a7146; --ok-wash: #eff7f2; --ok-line: #bcdcc8;
        --bad: #a3261b; --bad-wash: #fdf3f2; --bad-line: #efc4be;
        --amber: #7a5208; --amber-wash: #fdf7ee; --amber-line: #ecd6b3;
        --r: 8px; --col: 640px;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { background: var(--paper); -webkit-text-size-adjust: 100%; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; color: var(--body); background: var(--paper); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
      a { color: var(--blue); text-decoration: none; }
      a:hover { color: var(--blue-dark); }
      :focus-visible { outline: 2px solid var(--blue-dark); outline-offset: 2px; }
      h1, h2, h3 { color: var(--ink); margin: 0; }
      p { margin: 0; }
      i[lang="tr"] { font-style: italic; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
      .trk-soon { color: var(--muted); }
      .trk-soon small { font-size: .85em; }
      .trk-nw { white-space: nowrap; }
      [hidden] { display: none !important; }
      /* links inside running text carry an underline as well as their colour (WCAG 1.4.1, QA-2) */
      main p a:not(.btn), .note a, .help a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; text-decoration-color: rgb(40 122 158 / .55); }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      button { font: inherit; }

      .play { flex: 1 0 auto; width: 100%; max-width: calc(var(--col) + 48px); margin: 0 auto; padding: 20px 24px 40px; }
      @media (max-width: 599px) { .play { padding: 12px 16px 32px; } }

      /* notices */
      .notices:empty { display: none; }
      .notice { border: 1px solid var(--amber-line); background: var(--amber-wash); color: #5e4210; border-radius: var(--r); padding: 10px 14px; margin: 0 0 12px; font-size: 14px; }
      .notice.err { border-color: var(--bad-line); background: var(--bad-wash); color: #6e1d15; }
      .notice button, .notice a { font: inherit; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; cursor: pointer; }

      /* buttons */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r);
             border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 14.5px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background-color .15s, border-color .15s, color .15s; }
      .btn:hover { border-color: #cfcfcb; color: var(--ink); background: var(--panel); }
      .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
      .btn.primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); color: #fff; }
      .btn.big { min-height: 50px; padding: 0 26px; font-size: 15.5px; }
      .btn:disabled, .btn:disabled:hover { background: var(--panel); border-color: var(--line); color: var(--faint); cursor: default; }
      .btn.ghost { border-color: transparent; background: none; color: var(--body); }
      .btn.ghost:hover { background: var(--panel); color: var(--ink); }
      .btn svg { flex: none; }
      .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
      .tag.retry { background: var(--warm-wash); color: var(--warm); }

      /* speaker buttons (TRK.tts.button) */
      .trk-say { display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--blue); cursor: pointer; vertical-align: middle; padding: 0; }
      .trk-say:hover { border-color: var(--blue); background: var(--blue-tint); }
      .trk-say.trk-say-slow { color: var(--blue-dark); }
      @media (pointer: coarse) { .trk-say { width: 44px; height: 44px; } }

      /* top bar: quit, progress */
      .topbar { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; }
      .icon-btn { display: grid; place-items: center; width: 44px; height: 44px; flex: none; margin-left: -10px; border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer; }
      .icon-btn:hover { background: var(--panel); color: var(--ink); }
      .track { flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
      .track { position: relative; }
      .track i { position: relative; display: block; height: 100%; width: 0; border-radius: 5px; background: var(--lv); transition: width .55s cubic-bezier(.34, 1.56, .64, 1); overflow: hidden; }
      .track i::after { content: ""; position: absolute; inset: 0 auto 0 -40%; width: 40%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .55), transparent); opacity: 0; }
      .track i.glint::after { animation: glint .7s ease-out .15s; }
      @keyframes glint { 0% { left: -40%; opacity: 1; } 100% { left: 110%; opacity: 1; } }
      /* "3 in a row" and today's XP ring (UI-5): visual only, the XP rules don't change */
      .combo { display: inline-flex; align-items: center; gap: 3px; height: 26px; padding: 0 9px 0 6px; border-radius: 999px; background: var(--warm-wash); color: var(--warm); font-size: 12.5px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .combo svg { width: 15px; height: 15px; }
      .combo.bump { animation: bump .4s cubic-bezier(.3, 1.8, .5, 1); }
      .combo.hot { background: var(--warm); color: #fff; }
      .combo.hot svg { animation: flicker .9s ease-in-out infinite; }
      @keyframes bump { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: none; } }
      @keyframes flicker { 0%, 100% { transform: rotate(-4deg) scale(1); } 50% { transform: rotate(4deg) scale(1.12); } }
      .xpr { position: relative; display: grid; place-items: center; flex: none; width: 30px; height: 30px; }
      .xpr svg { display: block; }
      .xpr .bg { stroke: var(--line); }
      .xpr .fg { stroke: var(--lv); transition: stroke-dashoffset .5s ease; }
      .xpr.met .fg { stroke: var(--ok); }
      .xpr .plus { position: absolute; right: -6px; top: -4px; font-size: 12px; font-weight: 750; color: var(--ok); opacity: 0; pointer-events: none; white-space: nowrap; }
      .xpr .plus.go { animation: float-up .9s ease-out; }
      @keyframes float-up { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 25% { opacity: 1; transform: translateY(0) scale(1.1); } 100% { opacity: 0; transform: translateY(-16px); } }
      @media (max-width: 399px) { .combo .w { display: none; } }
      .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 44px; text-align: right; }

      /* start and end cards */
      .kicker { font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--lv-dark); margin-bottom: 6px; }
      .start h1, .end h1, .msg h1 { font-size: 28px; line-height: 1.2; font-weight: 650; letter-spacing: -0.02em; }
      .goal { margin-top: 8px; font-size: 16px; color: var(--body); }
      .tip { margin-top: 20px; border: 1px solid var(--lv-line); background: var(--lv-tint); border-radius: var(--r); padding: 14px 16px; font-size: 15px; color: var(--ink); }
      .tip .tip-t { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--lv-dark); margin-bottom: 6px; }
      .tip .more { display: inline-block; margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--blue-dark); }
      .words { margin-top: 22px; }
      .words h2, .sec-t { font-size: 13px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
      .wlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }
      .wlist li { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 0; border-bottom: 1px solid var(--line); }
      .wlist .w-tr { color: var(--ink); font-weight: 600; font-size: 15.5px; }
      .wlist .w-en { color: var(--muted); font-size: 14px; }
      .wlist .w-txt { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
      .wlist .w-card { margin-left: auto; flex: none; font-size: 13px; font-weight: 600; color: var(--muted); padding: 10px 2px 10px 8px; text-decoration: none; }
      .wlist .w-card:hover, .wlist .w-card:focus-visible { color: var(--blue-dark, var(--ink)); text-decoration: underline; }
      @media (max-width: 599px) { .wlist { grid-template-columns: minmax(0, 1fr); } .start h1, .end h1, .msg h1 { font-size: 24px; } }
      .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; align-items: center; }
      .meta { margin-top: 12px; font-size: 13.5px; color: var(--muted); }
      .start .notice, .msg .notice { margin: 18px 0 0; }
      .msg p.lede { margin-top: 10px; font-size: 16px; }

      .end { position: relative; isolation: isolate; text-align: center; padding-top: 12px; }
      .end::before { content: ""; position: absolute; z-index: -1; left: -24px; right: -24px; top: -20px; height: 300px; pointer-events: none;
                     background: var(--iznik) 50% 0 / 64px 64px; opacity: .09;
                     -webkit-mask-image: radial-gradient(closest-side at 50% 30%, #000 30%, transparent 100%); mask-image: radial-gradient(closest-side at 50% 30%, #000 30%, transparent 100%); }
      @media (max-width: 599px) { .end::before { left: -16px; right: -16px; } }
      .end .acts { justify-content: center; }
      .end > .confetti { position: absolute; left: 50%; top: -20px; width: min(900px, calc(100vw - 32px)); height: 560px; transform: translateX(-50%); pointer-events: none; z-index: 5; }
      .badge { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--lv-wash); color: var(--lv-dark); }
      .end .badge { animation: badge-in .6s cubic-bezier(.3, 1.6, .5, 1) both; }
      .end .badge:not(.fail) { background: var(--lv); color: var(--lv-on); box-shadow: 0 0 0 6px var(--lv-wash); }
      @keyframes badge-in { 0% { transform: scale(.3) rotate(-20deg); opacity: 0; } 60% { transform: scale(1.12) rotate(4deg); opacity: 1; } 100% { transform: none; } }
      .end .flame.up { animation: flicker .9s ease-in-out 3 .9s; }
      .end .flame.up + div .big { animation: bump .5s cubic-bezier(.3, 1.8, .5, 1) .9s both; }
      .end .stats { animation: rise-in .45s ease-out .25s both; }
      .end .ring-stat { animation: none; }
      @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .new-tile { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 8px 14px 8px 10px; border: 1px solid var(--lv-line); background: var(--lv-tint); border-radius: 999px; font-size: 14.5px; color: var(--ink); }
      .new-tile.gold { border-color: rgb(168 120 18 / 35%); background: rgb(168 120 18 / 7%); }
      .new-tile .tw-t { width: 26px; animation: tile-drop .75s cubic-bezier(.3, 1.45, .5, 1) .7s both; }
      @keyframes tile-drop { 0% { transform: translateY(-26px) scale(1.9) rotate(-14deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; opacity: 1; } }
      .badge.fail { background: var(--warm-wash); color: var(--warm); }
      .end-sub { margin-top: 6px; font-size: 15.5px; }
      .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 24px 0 0; border: 1px solid var(--line); border-radius: var(--r); text-align: left; }
      .stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat { padding: 14px 16px; min-width: 0; display: flex; gap: 12px; align-items: center; }
      .stat + .stat { border-left: 1px solid var(--line); }
      .stat .big { font-size: 22px; font-weight: 650; color: var(--ink); line-height: 1.15; font-variant-numeric: tabular-nums; }
      .stat .lbl { font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
      .flame { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); color: var(--faint); }
      .flame.on { background: var(--warm-wash); color: var(--warm); }
      .ring { flex: none; }
      .ring .bg { stroke: var(--line); }
      .ring .fg { stroke: var(--lv); transition: stroke-dashoffset .9s cubic-bezier(.3, .9, .4, 1); }
      @media (max-width: 599px) {
        .stat { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; }
        .stat .big { font-size: 19px; }
        .stat .lbl { font-size: 12px; }
        .flame { width: 28px; height: 28px; }
        .flame svg { width: 16px; height: 16px; }
        .stats .ring-stat { flex-direction: row; align-items: center; }
      }
      .after { margin-top: 18px; font-size: 14.5px; }
      .after a { font-weight: 600; }

      /* exercise */
      .ex-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
      .instr { font-size: 12.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--lv-dark); }
      .instr:focus { outline: none; }
      .from { font-size: 12.5px; color: var(--muted); }
      .q { font-size: 21px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 18px; }
      .q i[lang="tr"] { color: var(--lv-dark); }
      .sub { margin: -10px 0 18px; font-size: 15px; color: var(--muted); }
      .hint { margin: 0 0 16px; border: 1px solid var(--amber-line); background: var(--amber-wash); color: #4f3a0f; border-radius: var(--r); padding: 10px 14px; font-size: 14.5px; }
      .hint b.ht { font-weight: 650; margin-right: 4px; }
      @media (max-width: 599px) { .q { font-size: 19px; } }

      /* dialogue context (mcq) */
      .ctx { margin: 0 0 18px; display: grid; gap: 8px; }
      .ctx-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 8px 8px 14px; }
      .ctx-who { font-size: 12.5px; font-weight: 650; color: var(--muted); }
      .ctx-tr { color: var(--ink); font-size: 16px; }
      .ctx-en { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }
      .ctx-line .trk-say { grid-column: 2; grid-row: 1 / span 2; }

      /* options */
      .opts { display: grid; gap: 10px; }
      .opt { position: relative; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 10px 14px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 10px; background: #fff; color: var(--ink); font-size: 16.5px; cursor: pointer; transition: border-color .12s, background-color .12s; }
      .opt:hover { border-color: #cfcfcb; background: var(--panel); }
      .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
      .opt .k { flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12.5px; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; }
      .opt.sel { border-color: var(--blue); background: var(--blue-tint); }
      .opt.sel .k { border-color: var(--blue); color: var(--blue-dark); }
      .opt:focus-within { outline: 2px solid var(--blue-dark); outline-offset: 2px; }
      .opt:has(input:focus:not(:focus-visible)) { outline: none; }
      .opt.right { border-color: var(--ok); background: var(--ok-wash); }
      .opt.right .k { border-color: var(--ok); color: var(--ok); }
      .opt.wrong { border-color: var(--bad); background: var(--bad-wash); }
      .opt.wrong .k { border-color: var(--bad); color: var(--bad); }
      .opt.off { cursor: default; }
      .opt.off:not(.right):not(.wrong) { color: var(--muted); }
      @media (hover: none) { .opt .k { display: none; } }

      /* typed answers */
      .ans { display: block; width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 17px; line-height: 1.45; color: var(--ink); background: var(--panel); }
      .ans:focus { outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px var(--blue-wash); }
      .ans:disabled { color: var(--ink); background: var(--panel); }
      .ans.tall { min-height: 140px; }
      .ans.right { border-color: var(--ok); background: var(--ok-wash); }
      .ans.almost { border-color: var(--amber); background: var(--amber-wash); }
      .ans.wrong { border-color: var(--bad); background: var(--bad-wash); }
      .prompt { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
      .prompt p { font-size: 21px; line-height: 1.4; color: var(--ink); font-weight: 500; padding-top: 2px; min-width: 0; overflow-wrap: anywhere; }   /* a single long word (C2 unit 6) wraps at 360 px */
      @media (max-width: 599px) { .prompt p { font-size: 19px; } }

      /* Turkish letter bar */
      .kb { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; max-width: 420px; margin-top: 10px; }
      .kb button { min-height: 44px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: #fff; color: var(--ink); font-size: 18px; cursor: pointer; padding: 0; touch-action: manipulation; }
      .kb button:hover { background: var(--panel); border-color: #cfcfcb; }
      .kb button:active { background: var(--blue-tint); }
      .kb .shift[aria-pressed="true"] { background: var(--blue-wash); border-color: var(--blue); color: var(--blue-dark); }
      .kb button:disabled { color: var(--faint); background: var(--panel); cursor: default; }

      /* listen */
      .listen { display: flex; align-items: center; gap: 16px; margin: 6px 0 24px; }
      .play-btn { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; cursor: pointer; box-shadow: 0 3px 0 var(--blue-dark); }
      .play-btn:hover { background: var(--blue-dark); }
      .play-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--blue-dark); }
      .play-btn.slow { width: 52px; height: 52px; background: #fff; color: var(--blue-dark); border: 1px solid var(--line); box-shadow: 0 2px 0 var(--line); }
      .play-btn.slow:hover { background: var(--blue-tint); }

      /* cloze */
      .cloze { font-size: 22px; line-height: 2.1; color: var(--ink); margin-bottom: 6px; }
      .cz-w { white-space: nowrap; }
      .cz-w:has(.bopts) { white-space: normal; }   /* an option group too wide to sit beside the letters it joins may go to the next line */
      .blank { font: inherit; font-size: 20px; color: var(--ink); border: 0; border-bottom: 2px solid var(--blue); border-radius: 4px 4px 0 0; background: var(--blue-tint); padding: 0 4px; height: 38px; text-align: center; min-width: 3ch; max-width: 100%; vertical-align: baseline; }
      .blank:focus { outline: none; background: var(--blue-wash); }
      .blank.right { border-color: var(--ok); background: var(--ok-wash); }
      .blank.almost { border-color: var(--amber); background: var(--amber-wash); }
      .blank.wrong { border-color: var(--bad); background: var(--bad-wash); }
      .bopts { display: inline-flex; flex-wrap: wrap; max-width: calc(100% - 1.5ch); gap: 4px; vertical-align: baseline; padding: 2px; border-radius: 8px; background: var(--panel); border: 1px dashed var(--faint); }   /* long options wrap inside the group at 360 px (QA-2) */
      .bopt { position: relative; display: inline-flex; }
      .bopt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
      .bopt span { display: inline-grid; place-items: center; min-width: 44px; height: 40px; padding: 0 10px; border-radius: 6px; font-size: 19px; line-height: 1; cursor: pointer; color: var(--body); border: 1px solid transparent; }
      .bopt input:checked + span { background: #fff; border-color: var(--blue); color: var(--ink); }
      .bopt input:focus-visible + span { outline: 2px solid var(--blue-dark); outline-offset: 1px; }
      .bopts.right { border-style: solid; border-color: var(--ok); background: var(--ok-wash); }
      .bopts.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-wash); }
      .bopts.off span { cursor: default; }
      .en { font-size: 15px; color: var(--muted); margin-bottom: 8px; }
      @media (max-width: 599px) { .cloze { font-size: 20px; } .blank { font-size: 18px; } }

      /* tiles: wordbank and morph */
      .line { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; min-height: 112px; padding: 4px 0 8px; margin-bottom: 16px; background: repeating-linear-gradient(to bottom, transparent 0, transparent 55px, var(--line) 55px, var(--line) 56px); }
      .line.morph { min-height: 64px; gap: 3px; background: linear-gradient(to top, var(--line) 0, var(--line) 1px, transparent 1px); }
      .bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .tile { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; min-width: 44px; padding: 0 14px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 10px; background: #fff; color: var(--ink); font-size: 17px; cursor: pointer; touch-action: manipulation; }
      .tile:hover { background: var(--panel); border-color: #cfcfcb; }
      .tile.used { background: var(--panel); color: transparent; border-color: var(--line); border-style: dashed; cursor: default; }
      .tile.used:hover { background: var(--panel); }
      .line .tile { animation: pop .14s ease-out; }
      .line.morph .tile { padding: 0 10px; }
      .line.morph .tile { position: relative; margin-left: 16px; }
      .line.morph .tile:first-child { margin-left: 0; }
      .line.morph .tile + .tile::before { content: "+"; position: absolute; left: -11px; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font-size: 15px; pointer-events: none; }
      .line.right .tile { border-color: var(--ok-line); background: var(--ok-wash); }
      .line.wrong .tile { border-color: var(--bad-line); background: var(--bad-wash); }
      .tile:disabled { cursor: default; }
      .build { margin: -6px 0 16px; font-size: 22px; font-weight: 600; color: var(--ink); min-height: 33px; letter-spacing: .01em; overflow-wrap: anywhere; }
      @keyframes pop { from { transform: scale(.92); opacity: .6; } to { transform: none; opacity: 1; } }

      /* match */
      .match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 14px; }
      .mcol { display: grid; gap: 10px; align-content: start; }
      .m { min-height: 54px; padding: 8px 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 10px; background: #fff; color: var(--ink); font-size: 16.5px; line-height: 1.25; cursor: pointer; text-align: center; touch-action: manipulation; transition: border-color .12s, background-color .12s, opacity .25s; }
      .m:hover { background: var(--panel); border-color: #cfcfcb; }
      .m.sel { border-color: var(--blue); background: var(--blue-wash); color: var(--blue-dark); }
      .m.done { border-color: var(--ok-line); background: var(--ok-wash); color: var(--ok); opacity: .55; cursor: default; animation: matched .65s ease-out forwards; }
      @keyframes matched { 0% { opacity: 1; transform: scale(1); border-color: var(--ok); } 30% { opacity: 1; transform: scale(1.06); border-color: var(--ok); background: #dff0e5; } 100% { opacity: .4; transform: scale(.94); } }
      .m.no { border-color: var(--bad); background: var(--bad-wash); color: var(--bad); animation: shake .3s; }
      @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

      /* conjugate */
      .conj { display: grid; gap: 8px; max-width: 420px; }
      .crow { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 12px; }
      .cp { font-size: 16px; font-weight: 600; color: var(--muted); text-align: right; }
      .cin { height: 48px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; font: inherit; font-size: 17px; color: var(--ink); background: var(--panel); min-width: 0; width: 100%; }
      .cin:focus { outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px var(--blue-wash); }
      .cin.right { border-color: var(--ok); background: var(--ok-wash); }
      .cin.almost { border-color: var(--amber); background: var(--amber-wash); }
      .cin.wrong { border-color: var(--bad); background: var(--bad-wash); }
      .cfix { grid-column: 2; margin-top: -4px; font-size: 14px; color: var(--ok); }

      /* reading and open */
      .rtitle { font-size: 20px; font-weight: 650; margin-bottom: 10px; }
      .passage { border-left: 3px solid var(--lv-wash); padding: 2px 0 2px 16px; margin: 12px 0 14px; color: var(--ink); font-size: 17px; line-height: 1.6; }
      .passage p + p { margin-top: 10px; }
      .say-row { display: flex; gap: 8px; align-items: center; }
      details.more-d { margin: 0 0 16px; border: 1px solid var(--line); border-radius: var(--r); }
      details.more-d > summary { cursor: pointer; list-style: none; display: flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--ink); }
      details.more-d > summary::-webkit-details-marker { display: none; }
      details.more-d > summary::after { content: "+"; margin-left: auto; color: var(--muted); font-weight: 400; font-size: 18px; }
      details.more-d[open] > summary::after { content: "−"; }
      details.more-d .in { padding: 0 14px 12px; font-size: 14.5px; }
      .gl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; margin: 0; }
      .gl dt { color: var(--ink); font-weight: 600; }
      .gl dd { margin: 0; color: var(--body); }
      .rq { border: 0; margin: 0 0 18px; padding: 0; min-width: 0; }
      .rq legend { padding: 0; font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
      .rq-ex { margin-top: 8px; font-size: 14.5px; color: var(--body); }
      .src { margin: 0 0 16px; border-left: 3px solid var(--lv-wash); padding: 4px 0 4px 16px; font-size: 18px; line-height: 1.5; color: var(--ink); display: flex; gap: 12px; align-items: flex-start; }
      .models { margin-top: 18px; display: grid; gap: 14px; }
      .model { border: 1px solid var(--ok-line); background: var(--ok-wash); border-radius: var(--r); padding: 12px 14px; color: var(--ink); font-size: 16px; display: flex; gap: 10px; align-items: flex-start; }
      .model .ml { display: block; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ok); margin-bottom: 2px; }
      .checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      .checklist label { display: flex; gap: 10px; align-items: flex-start; min-height: 32px; font-size: 15px; cursor: pointer; color: var(--ink); }
      .checklist input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--blue); flex: none; }
      .self { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .self .btn { flex-direction: column; gap: 0; min-height: 56px; line-height: 1.2; }
      .self .btn small { font-weight: 500; font-size: 12px; color: var(--muted); }

      /* answer dock */
      .dock { position: sticky; bottom: 0; z-index: 10; border-top: 1px solid var(--line); background: #fff; padding: 14px 24px calc(14px + env(safe-area-inset-bottom)); }
      .dock-in { max-width: var(--col); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 10px 16px; }
      .dock .fb { grid-column: 1; min-width: 0; max-height: 46vh; overflow: auto; }
      .dock .fb:empty, .dock .left:empty { display: none; }
      .dock .left { grid-column: 1; display: flex; gap: 8px; align-items: center; min-width: 0; }
      .dock .go { grid-column: 2; min-width: 148px; transition: none; }
      .dock.ok { background: var(--ok-wash); border-top-color: var(--ok-line); }
      .dock.almost { background: var(--amber-wash); border-top-color: var(--amber-line); }
      .dock.bad { background: var(--bad-wash); border-top-color: var(--bad-line); }
      .dock.ok .go { background: var(--ok); border-color: var(--ok); }
      .dock.ok .go:hover { background: #1f5a37; border-color: #1f5a37; }
      .dock.bad .go { background: var(--bad); border-color: var(--bad); }
      .dock.bad .go:hover { background: #821d14; border-color: #821d14; }
      .dock.almost .go { background: var(--amber); border-color: var(--amber); }
      .fb-t { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 650; line-height: 1.25; }
      .dock.ok .fb-t { color: var(--ok); }
      .dock.bad .fb-t { color: var(--bad); }
      .dock.almost .fb-t { color: var(--amber); }
      .fb-i { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; background: currentColor; }
      .fb-i svg { color: #fff; }
      .fb p, .fb .fb-l { margin-top: 6px; font-size: 14.5px; color: var(--ink); line-height: 1.45; }
      .fb .lbl { display: block; font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
      .fb .big-a { display: flex; align-items: center; gap: 8px; font-size: 16.5px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
      .fb .trk-say { width: 32px; height: 32px; }
      .fb .note { color: var(--amber); font-weight: 600; }
      .fb ul { margin: 4px 0 0; padding-left: 18px; }
      .fb .muted-s { color: var(--muted); font-size: 13.5px; }
      /* answer animations (UI-5): a right answer pops, a wrong one shakes, the verdict draws itself in */
      .ok-anim .opt.right, .ok-anim .ans.right, .ok-anim .blank.right, .ok-anim .cin.right, .ok-anim .bopts.right, .ok-anim .line.right .tile { animation: ok-pop .45s cubic-bezier(.3, 1.7, .5, 1); }
      .ok-anim .line.right .tile:nth-child(2) { animation-delay: .04s; } .ok-anim .line.right .tile:nth-child(3) { animation-delay: .08s; }
      .ok-anim .line.right .tile:nth-child(4) { animation-delay: .12s; } .ok-anim .line.right .tile:nth-child(n+5) { animation-delay: .16s; }
      .bad-anim .opt.wrong, .bad-anim .ans.wrong, .bad-anim .blank.wrong, .bad-anim .cin.wrong, .bad-anim .bopts.wrong, .bad-anim .line.wrong { animation: shake .36s; }
      @keyframes ok-pop { 0% { transform: scale(1); } 40% { transform: scale(1.045); } 100% { transform: none; } }
      .dock.ok .fb-i, .dock.bad .fb-i, .dock.almost .fb-i { animation: badge-in .45s cubic-bezier(.3, 1.6, .5, 1); }
      .dock.ok .fb-i path { stroke-dasharray: 18; stroke-dashoffset: 18; animation: draw .35s ease-out .15s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .dock.ok .fb > *, .dock.bad .fb > *, .dock.almost .fb > * { animation: rise-in .3s ease-out both; }
      .dock.ok .fb > :nth-child(2), .dock.bad .fb > :nth-child(2), .dock.almost .fb > :nth-child(2) { animation-delay: .05s; }
      .dock.ok .fb > :nth-child(n+3), .dock.bad .fb > :nth-child(n+3), .dock.almost .fb > :nth-child(n+3) { animation-delay: .1s; }
      @media (max-width: 599px) {
        .dock { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
        .dock-in { grid-template-columns: minmax(0, 1fr); }
        .dock .fb, .dock .left, .dock .go { grid-column: 1; }
        .dock .go { width: 100%; min-height: 50px; }
        .dock.has-left .dock-in { grid-template-columns: auto minmax(0, 1fr); }
        .dock.has-left .fb { grid-column: 1 / -1; }
        .dock.has-left .left { grid-column: 1; }
        .dock.has-left .go { grid-column: 2; }
      }

      /* quit dialog */
      .dlg { border: 1px solid var(--line); border-radius: 12px; padding: 22px 22px 18px; max-width: min(420px, calc(100vw - 32px)); color: var(--body); box-shadow: 0 12px 40px rgb(0 0 0 / .14); }
      .dlg::backdrop { background: rgb(20 24 32 / .35); }
      .dlg h2 { font-size: 19px; }
      .dlg p { margin-top: 8px; font-size: 15px; }
      .dlg .acts { margin-top: 18px; justify-content: flex-end; }

      /* the TYS practice test (?exam=, PROJECT.md 6.8): start card, sections, countdown, recordings, rubric, results. Site blue: it belongs to no level. */
      .xsec { flex: none; font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--blue-dark); }
      .count.warn { color: var(--warm); font-weight: 650; }
      .x-secs { list-style: none; margin: 22px 0 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r); }
      .x-secs li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; }
      .x-secs li + li { border-top: 1px solid var(--line); }
      .x-sn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--blue-wash); color: var(--blue-dark); font-size: 13px; font-weight: 650; }
      .x-st { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
      .x-st b { color: var(--ink); font-weight: 600; }
      .x-st small, .x-sp { font-size: 13px; color: var(--muted); }
      .x-note { margin-top: 18px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 12px 14px; font-size: 14px; }
      .x-note b { color: var(--ink); }
      .x-untimed { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; cursor: pointer; }
      .x-untimed input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--blue); flex: none; }
      .x-untimed span { display: flex; flex-direction: column; line-height: 1.35; }
      .x-untimed b { color: var(--ink); font-weight: 600; }
      .x-untimed small { font-size: 13px; color: var(--muted); }
      .x-lede { margin-top: 14px; font-size: 16px; }
      .x-tabs { display: flex; gap: 8px; margin: 0 0 18px; overflow-x: auto; }
      .x-tab { display: flex; flex-direction: column; align-items: flex-start; min-height: 48px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: 14px; font-weight: 600; line-height: 1.25; text-align: left; cursor: pointer; flex: none; }
      .x-tab small { font-size: 12px; font-weight: 500; color: var(--muted); }
      .x-tab[aria-selected="true"] { border-color: var(--blue); background: var(--blue-tint); }
      .x-tab:disabled { cursor: default; opacity: .55; }
      .x-task { font-size: 16px; color: var(--ink); margin: 0 0 14px; }
      .x-gap { display: inline-flex; align-items: baseline; gap: 5px; min-width: 6.5em; padding: 0 6px; border-bottom: 2px solid var(--blue); border-radius: 4px 4px 0 0; background: var(--blue-tint); }
      .x-gn { font-size: 12px; font-weight: 700; color: var(--blue-dark); font-variant-numeric: tabular-nums; }
      .x-gw { font-weight: 600; }
      .x-q legend, .x-aq { display: flex; gap: 10px; align-items: flex-start; }
      .x-n { flex: none; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--ink); color: #fff; display: inline-grid; place-items: center; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .opts.x-row { grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); }
      .opts.x-row .opt { justify-content: center; min-height: 48px; }
      .x-rec { display: flex; align-items: center; gap: 12px; margin: 4px 0 20px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
      .x-rt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
      .x-rt b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
      .x-rt span { font-size: 13.5px; color: var(--muted); }
      .x-dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--faint); display: grid; place-items: center; }
      .x-rec.on { border-color: var(--blue); background: var(--blue-tint); }
      .x-rec.on .x-dot { background: var(--blue); animation: x-pulse 1.2s ease-in-out infinite; }
      .x-rec.done .x-dot { width: 22px; height: 22px; background: var(--ok); color: #fff; }

      function dReplay(line, slow) {
        if (!line || !S.speech) return;
        G.last = line;
        var u = T.tts.speak(line.tr, { pitch: line.pitch, slow: !!slow });
        if (u && line.face) { u.onstart = function () { dTalk(line.face, true); }; u.onend = u.onerror = function () { dTalk(line.face, false); }; }
      }
      // FX-1: faces. A bubble's face (only the latest one blinks), its mouth while a line is read, and the reaction of the
      // person you answered: happy for a natural reply, a raised eyebrow for a register slip, puzzled for a miss.
      function dFaceOf(el) { return el && el.querySelector(".cf"); }
      function dTalk(face, on) { if (CAST && face) CAST.talk(face, on); }
      function dReact(id, outcome) {
        if (!CAST) return;
        var all = $("dl-chat").querySelectorAll('.dl-b.them[data-who="' + id + '"] .cf'), f = all[all.length - 1];
        if (f) CAST.mood(f, outcome === "natural" ? "happy" : outcome === "slip" ? "unsure" : "puzzled", !reduce);
      }
      function dBubble(o) {
        var me = o.who === "me", p = me ? null : dPerson(o.who), hide = !me && G.listen && S.speech;
        G.log.push(o);
        var tools = me ? sayHtml(o.tr)
          : (S.speech ? '<button type="button" class="trk-say dl-say" aria-label="Listen">' + DICON.say + '</button><button type="button" class="trk-say trk-say-slow dl-say" data-slow="1" aria-label="Listen slowly">' + DICON.slow + "</button>" : "");
        tools += '<button type="button" class="dl-tl" aria-expanded="' + G.showEn + '">' + (G.showEn ? "Hide translation" : "Translate") + "</button>";
        var el = document.createElement("div");
        el.className = "dl-b " + (me ? "me" : "them") + (hide ? " hid" : "") + (reduce ? "" : " in");
        if (!me) el.setAttribute("data-who", o.who);
        if (!me && CAST) $("dl-chat").querySelectorAll(".cf.live").forEach(function (f) { f.classList.remove("live"); });
        el.innerHTML = (!me && CAST ? '<span class="dl-face">' + CAST.face(G.D.id, p, 38, { live: true }) + "</span>" : "") + (me ? '<div class="dl-who">You</div>' : '<div class="dl-who" lang="tr">' + esc(p.name) + "</div>") +
          '<p class="dl-tr" lang="tr"' + (hide ? " hidden" : "") + ">" + esc(o.tr) + "</p>" + (hide ? '<button type="button" class="dl-show">Show the words</button>' : "") +
          '<p class="dl-en"' + (G.showEn ? "" : " hidden") + ">" + esc(o.en) + "</p>" + '<div class="dl-tools">' + tools + "</div>" +
          (o.mark || "") + (o.note ? '<div class="dl-note">' + rich(o.note) + "</div>" : "");
        $("dl-chat").appendChild(el);
        prep(el);
        el.addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          if (b.classList.contains("dl-say")) dReplay({ tr: o.tr, pitch: p && p.pitch, face: dFaceOf(el) }, b.getAttribute("data-slow"));
          else if (b.classList.contains("dl-show")) dReveal(el);
          else if (b.classList.contains("dl-tl")) {
            var en = el.querySelector(".dl-en"), open = en.hidden;
            en.hidden = !open; b.setAttribute("aria-expanded", String(open)); b.textContent = open ? "Hide translation" : "Translate";
          }
        });
        dScroll(el);
        return el;
      }
      function dReveal(el) { el.classList.remove("hid"); el.querySelector(".dl-tr").hidden = false; var b = el.querySelector(".dl-show"); if (b) b.remove(); }
      function dRevealAll() { $("dl-chat").querySelectorAll(".dl-b.hid").forEach(dReveal); }
      // Keeps an element in sight above the dock.
      function dScroll(el) {
        requestAnimationFrame(function () {
          if (!el || !el.isConnected) return;
          var r = el.getBoundingClientRect(), dh = dock.hidden ? 0 : dock.getBoundingClientRect().height;
          var over = r.bottom - (window.innerHeight - dh - 12);
          if (over > 0) window.scrollBy({ top: over, behavior: reduce ? "auto" : "smooth" });
        });
      }

      // ── your turn: the prompt in the dock, and the replies as choices or a text box ──
      function dTurn(n) {
        G.cur = n; G.first = true; G.misses = 0; G.helped = false; G.shown = !G.typing; G.struck = {}; G.draft = "";
        G.order = shuffle(range(n.turn.replies.length));
        G.turnNo += 1; $("count").textContent = "Turn " + G.turnNo;
        dInput();
      }
      function dTo(n) { n = n || G.cur; return dPerson(n.turn.to || n.who); }
      function dInput() {
        var n = G.cur, t = n.turn, box = $("dl-in");
        S.phase = "dturn"; G.after = null;
        dock.className = "dock"; dockLeft.innerHTML = ""; dock.classList.remove("has-left");
        fb.innerHTML = '<p class="dl-prompt"><span class="lbl">Your turn' + (t.to && t.to !== n.who ? ', to <span lang="tr">' + esc(dTo().name) + "</span>" : "") + "</span>" + esc(t.prompt) + "</p>";
        if (G.shown) {
          box.innerHTML = '<div class="dl-opts" role="group" aria-label="Your reply">' + G.order.map(function (i, k) {
            var r = t.replies[i], off = !!G.struck[i];
            return '<button type="button" class="dl-opt' + (off ? " struck" : "") + '" data-i="' + i + '"' + (off ? " disabled" : "") + '><span class="k" aria-hidden="true">' + (k + 1) + "</span>" +
              '<span class="ot"><span lang="tr">' + esc(r.tr) + "</span>" + (G.showEn ? '<span class="oe">' + esc(r.en) + "</span>" : "") + "</span></button>";
          }).join("") + "</div>";
          box.querySelectorAll(".dl-opt").forEach(function (b) { b.addEventListener("click", function () { dChoose(+b.getAttribute("data-i")); }); });
          go.hidden = true;
        } else {
          box.innerHTML = textArea("tr", "Your reply, in Turkish");
          prep(box);
          var ta = box.querySelector("textarea");
          ta.classList.add("dl-ta"); ta.rows = 2; ta.value = G.draft;
          ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); if (!e.shiftKey) dSend(); } });
          ta.addEventListener("input", function () { G.draft = ta.value; go.disabled = !ta.value.trim(); });
          dockLeft.innerHTML = '<button type="button" class="btn ghost" id="dl-help">Show the choices</button>'; dock.classList.add("has-left");
          $("dl-help").addEventListener("click", dHelp);
          go.hidden = false; go.textContent = "Send"; go.disabled = !ta.value.trim();
          if (!touch) ta.focus({ preventScroll: true });
        }
        dock.hidden = false;
        dScroll(box);
      }
      function dHelp() { G.helped = true; G.shown = true; dInput(); }
      function dChoose(i) { if (S.phase === "dturn" && !G.struck[i]) dAnswer(G.cur.turn.replies[i], i, null); }
      // A typed answer is matched against every reply of the turn (6.9): the first correct match, else the first almost.
      function dMatch(text) {
        var reps = G.cur.turn.replies, best = null;
        for (var i = 0; i < reps.length; i++) {
          var c = T.check(text, [reps[i].tr].concat(reps[i].accept || []), [], "tr", "lenient");
          if (c.verdict === "correct") return { i: i, c: c };
          if (c.verdict === "almost" && !best) best = { i: i, c: c };
        }
        return best;
      }
      function dSend() {
        if (S.phase !== "dturn" || G.shown) return;
        var ta = $("dl-in").querySelector("textarea"), text = ta ? ta.value.trim() : "";
        if (!text) return;
        var m = dMatch(text);
        if (m) return dAnswer(G.cur.turn.replies[m.i], m.i, { said: text, c: m.c });
        G.misses += 1;
        if (G.first) { G.first = false; G.turns.push({ node: G.cur, r: null, said: text, outcome: "miss", helped: G.helped, to: dTo() }); }
        var auto = G.misses >= 2;
        S.phase = "dfeedback";
        dock.className = "dock bad";
        fb.innerHTML = '<h2 class="fb-t"><span class="fb-i">' + ICON.cross + "</span>Not one of the replies here</h2><p>The conversation can't follow <i lang=\"tr\">" + esc(text) + "</i>. Read the task again" +
          (auto ? ", then choose one of the replies." : ", and try another way, or show the choices.") + "</p>";
        if (auto) { dockLeft.innerHTML = ""; dock.classList.remove("has-left"); go.textContent = "Show the choices"; G.after = function () { G.helped = true; G.shown = true; dInput(); }; }
        else {
          dockLeft.innerHTML = '<button type="button" class="btn ghost" id="dl-help">Show the choices</button>'; dock.classList.add("has-left");
          $("dl-help").addEventListener("click", dHelp);
          go.textContent = "Try again"; G.after = dInput;
        }
        go.hidden = false; go.disabled = false; go.focus({ preventScroll: true });
      }
      // The better reply to show after a slip or a miss: an ok one in the person's register, else one with no register.
      function dBetter(n, not) {
        var p = dTo(n), reps = n.turn.replies, i;
        for (i = 0; i < reps.length; i++) if (reps[i] !== not && reps[i].ok && reps[i].register && reps[i].register === p.register) return reps[i];
        for (i = 0; i < reps.length; i++) if (reps[i] !== not && reps[i].ok && !reps[i].register) return reps[i];
        return null;
      }
      function dAnswer(r, i, typed) {
        var n = G.cur, p = dTo(), slip = !!(r.register && p.register && r.register !== p.register);
        var outcome = !r.ok ? "miss" : slip ? "slip" : "natural", almost = !!(typed && typed.c.verdict === "almost");
        if (G.first) { G.first = false; G.turns.push({ node: n, r: r, said: typed ? typed.said : null, outcome: outcome, helped: G.helped, to: p }); }
        dRevealAll();
        $("dl-in").innerHTML = "";
        var mark = outcome === "slip" ? '<span class="dl-mark slip"><span lang="tr">' + r.register + '</span>&nbsp;→&nbsp;<span lang="tr">' + p.register + "</span></span>"
          : outcome === "miss" ? '<span class="dl-mark miss">Not quite</span>' : "";
        dBubble({ who: "me", tr: r.tr, en: r.en, mark: mark });
        dReact(p.id, outcome);
        if (outcome === "natural" && !r.why && !almost) { S.phase = "dtalk"; dock.hidden = true; return dLine(r.next); }
        var kind = outcome === "miss" ? "bad" : outcome === "slip" || almost ? "almost" : "ok";
        var title = outcome === "miss" ? "Not quite" : outcome === "slip" ? "Right words, wrong register" : almost ? "Almost right" : "Natural";
        var h = '<h2 class="fb-t"><span class="fb-i">' + (kind === "ok" ? ICON.check : kind === "almost" ? ICON.dash : ICON.cross) + "</span>" + esc(title) + "</h2>";
        if (almost) h += '<p><span class="note">' + esc(NOTES[typed.c.note] || "Almost") + ':</span> <span lang="tr"><b>' + esc(r.tr) + "</b></span>" + (outcome === "natural" ? " It counts as right." : "") + "</p>";
        if (slip) {
          var b = dBetter(n, r);
          h += '<p>You said <i lang="tr">' + r.register + "</i> to " + esc(p.role) + ". " + rich(p.why) + "</p>" +
            (b ? '<div class="fb-l"><span class="lbl">Better</span><span class="big-a"><span lang="tr">' + esc(b.tr) + "</span>" + sayHtml(b.tr) + "</span></div>" : "");
        }
        if (r.why) h += "<p>" + rich(r.why) + "</p>";
        S.phase = "dfeedback";
        dock.className = "dock " + kind; dock.hidden = false; dockLeft.innerHTML = ""; dock.classList.remove("has-left");
        fb.innerHTML = h; prep(fb);
        if (r.next) { go.textContent = "Continue"; G.after = function () { S.phase = "dtalk"; dock.hidden = true; dLine(r.next); }; }
        else {   // they react, and the turn comes again without this reply
          G.struck[i] = true; G.draft = "";
          if (r.react) { var rf = dFaceOf(dBubble({ who: p.id, tr: r.react.tr, en: r.react.en })); if (CAST && rf) CAST.mood(rf, "puzzled"); dSay({ tr: r.react.tr, pitch: p.pitch, face: rf }); }
          go.textContent = "Try again"; G.after = dInput;
        }
        go.hidden = false; go.disabled = false; go.focus({ preventScroll: true });
        dScroll($("dl-chat").lastElementChild);
      }
      function dGo() {
        if (S.phase === "dstart") return dBegin();
        if (S.phase === "dturn") return dSend();
        if (S.phase === "dfeedback" && G.after) { var f = G.after; G.after = null; return f(); }
        if (S.phase === "dend") return dDebrief();
      }
      function dEndReady(n) {
        G.end = n; S.phase = "dend";
        dRevealAll(); $("dl-in").innerHTML = "";
        dock.className = "dock ok"; dockLeft.innerHTML = ""; dock.classList.remove("has-left");
        fb.innerHTML = '<p class="dl-prompt"><span class="lbl">The end</span>' + esc(n.end) + "</p>";
        go.hidden = false; go.disabled = false; go.textContent = "See how it went"; dock.hidden = false;
        go.focus({ preventScroll: true });
        dScroll($("dl-chat").lastElementChild);
      }

      // ── the debrief: how it went, the key phrases, what to look at again, the whole conversation ──
      function dDebrief() {
        var D = G.D;
        S.phase = "dfin"; S.started = false; T.tts.cancel();
        dock.hidden = true; $("topbar").hidden = true;
        var tn = G.turns.length, nat = G.turns.filter(function (x) { return x.outcome === "natural"; }).length;
        var reg = G.turns.filter(function (x) { return x.r && x.r.register && x.to.register; });
        var regOk = reg.filter(function (x) { return x.r.register === x.to.register; }).length;
        var stats = '<div class="stats">' +
          '<div class="stat"><div><div class="big">' + tn + '</div><div class="lbl">' + (tn === 1 ? "turn" : "turns") + "</div></div></div>" +
          '<div class="stat"><div><div class="big">' + nat + " <small>of " + tn + '</small></div><div class="lbl">natural replies, first time</div></div></div>' +
          '<div class="stat"><div><div class="big">' + (reg.length ? regOk + " <small>of " + reg.length + "</small>" : "–") + '</div><div class="lbl"><i lang="tr">sen</i> or <i lang="tr">siz</i> right</div></div></div></div>';
        var acts = '<div class="acts"><a class="btn primary big" href="' + dHref(D.id) + '">Try it again</a><a class="btn" href="' + dHref() + '">Another conversation</a><a class="btn ghost" href="' + P.hub + '">Back to the course</a></div>';
        var phrases = '<section class="dl-sec" aria-labelledby="dl-ph"><h2 id="dl-ph">Key phrases</h2><ul class="dl-phr">' + D.phrases.map(function (f) {
          return '<li><div><span class="dl-pt" lang="tr">' + esc(f.tr) + '</span><span class="dl-pe">' + esc(f.en) + "</span>" + (f.note ? '<span class="dl-pn">' + rich(f.note) + "</span>" : "") + "</div>" + sayHtml(f.tr) + "</li>";
        }).join("") + "</ul></section>";
        var off = G.turns.filter(function (x) { return x.outcome !== "natural"; });
        var again = '<section class="dl-sec" aria-labelledby="dl-ag"><h2 id="dl-ag">To look at again</h2>' + (off.length ? '<ul class="dl-slips">' + off.map(function (x) {
          var b = dBetter(x.node, x.r), said = x.r ? x.r.tr : x.said;
          var why = x.outcome === "slip" ? 'You said <i lang="tr">' + x.r.register + "</i> to " + esc(x.to.role) + ". " + rich(x.to.why) : x.r ? (x.r.why ? rich(x.r.why) : "") : "The conversation couldn't follow that answer.";
          return '<li><p class="dl-q">' + esc(x.node.turn.prompt) + '</p><p><span class="lbl">' + (x.r ? "You said" : "You typed") + '</span><span lang="tr">' + esc(said) + "</span>" + (x.helped ? " (from the choices)" : "") + "</p>" +
            (b ? '<p><span class="lbl">Better</span><span lang="tr">' + esc(b.tr) + "</span>" + sayHtml(b.tr) + "</p>" : "") + (why ? "<p>" + why + "</p>" : "") + "</li>";
        }).join("") + "</ul>" : "<p>Nothing: every first answer was natural, and in the right register.</p>") + "</section>";
        var rev = '<section class="dl-sec" aria-labelledby="dl-rv"><h2 id="dl-rv">Go back to</h2><ul class="x-links">' + D.review.map(function (r) { return "<li>" + refLink(r) + "</li>"; }).join("") + "</ul></section>";
        var log = '<details class="dl-sec dl-log"><summary>The whole conversation</summary><dl class="x-script">' + G.log.map(function (o) {
          return "<dt>" + (o.who === "me" ? "You" : '<span lang="tr">' + esc(dPerson(o.who).name) + "</span>") + '</dt><dd><span lang="tr">' + esc(o.tr) + '</span><br><span class="dl-pe">' + esc(o.en) + "</span></dd>";
        }).join("") + "</dl></details>";
        var endFaces = CAST ? '<div class="dl-endfaces" aria-hidden="true">' + D.cast.map(function (p) { return CAST.face(D.id, p, 48, { mood: "happy" }); }).join("") + "</div>" : "";
        screen('<div class="end dl-end"><div class="badge">' + ICON.trophy + "</div>" + endFaces + '<p class="kicker">Conversation over</p><h1>' + esc(D.title) + '</h1><p class="end-sub">' + esc(G.end.end) + "</p>" + stats +
          '<p class="dl-again">It can go another way next time: try other replies.</p>' + acts + phrases + again + rev + log + "</div>", true);
      }
      document.addEventListener("keydown", function (e) {
        if (S.mode !== "dialogue" || !G || $("quit-dlg").open || e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
        var t = e.target, typing = t.matches && t.matches("input[type=text], textarea");
        if (e.key === "Enter" && !typing && !t.matches("button, a, summary, input") && (S.phase === "dfeedback" || S.phase === "dend")) { e.preventDefault(); dGo(); return; }
        if (typing) return;
        if (S.phase === "dturn" && G.shown && /^[1-4]$/.test(e.key)) {
          var i = G.order[+e.key - 1];
          if (i != null) { e.preventDefault(); dChoose(i); }
          return;
        }
        if ((e.key === "r" || e.key === "R") && G.last && /^d(turn|feedback|end|talk)$/.test(S.phase)) { e.preventDefault(); dReplay(G.last); }
      });

      // ───────────── 7. keyboard, quitting, boot ─────────────
      document.addEventListener("keydown", function (e) {
        if ($("quit-dlg").open || e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
        var t = e.target, typing = t.matches && t.matches("input[type=text], textarea");
        if (e.key === "Enter") {
          if (typing || t.matches("button, a, summary, input[type=checkbox]")) return;   // inputs and buttons handle Enter themselves
          if (S.phase === "start" || S.phase === "answer" || S.phase === "feedback") { e.preventDefault(); primary(); }
          return;
        }
        if (e.key === "Escape" && S.started && S.phase !== "start") { e.preventDefault(); askQuit(); return; }
        if (typing || S.phase !== "answer" || !S.view) return;
        if (/^[1-9]$/.test(e.key) && S.view.key && S.view.key(+e.key)) { e.preventDefault(); return; }
        if (e.key === "Backspace" && S.view.back && S.view.back()) { e.preventDefault(); }
      });
      function askQuit() {
        var d = $("quit-dlg");
        if (!S.started || S.phase === "start") { location.href = $("quit-go").href; return; }
        if (typeof d.showModal !== "function") { location.href = $("quit-go").href; return; }
        d.showModal(); $("quit-stay").focus();
      }
      $("quit").addEventListener("click", askQuit);
      $("quit-stay").addEventListener("click", function () { $("quit-dlg").close(); });
      $("quit-go").addEventListener("click", function () { S.started = false; });
      window.addEventListener("beforeunload", function (e) {
        if (S.started && (S.mode === "exam" || S.mode === "dialogue" || S.items.some(function (it) { return it.attempts; }))) { e.preventDefault(); e.returnValue = ""; }
      });

      function boot() {
        S.mode = params.has("id") ? "lesson" : params.has("review") ? "review" : params.has("test") ? "test" : params.get("practice") === "mistakes" ? "practice" : params.has("exam") ? "exam" : params.has("dialogue") ? "dialogue" : null;
        S.target = params.get("id") || params.get("review") || params.get("test") || params.get("exam") || params.get("dialogue") || null;
        notices();
        Promise.all([T.data.index(), T.tts.ready()]).then(function (r) {
          S.index = r[0]; S.voice = r[1]; S.flat = T.path.flatten(S.index);
          S.speech = !!S.voice && store.settings().tts;
          if (!S.mode) {
            var nx = T.path.nextLesson(S.index, store.course());
            return message({ title: "Pick a lesson", text: "Lessons, unit reviews and tests start from the course page.",
                             acts: (nx ? '<a class="btn primary" href="' + P.lesson + "?id=" + nx.id + '">Continue: ' + esc(nx.title) + "</a>" : "") + '<a class="btn" href="' + P.hub + '">Go to the course</a>' });
          }
          return MODES[S.mode]();
        }).catch(fail);
      }
      boot();
    });
    </script>
  </body>
</html>
