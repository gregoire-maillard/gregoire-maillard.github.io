# Mirrors the Turkish section of gregoiremaillard.com to dailyturkish.app. The Turkmen course has its own
# domain and workflow (dailyturkmen.app, sync-dailyturkmen.yml); dailyturkish.app/turkmen/ only redirects there.
# Source of truth = this repo. On every push to main that touches a Turkish
# file, copy those files (same paths) into a fresh folder, make
# turkish.html the home page, add CNAME dailyturkish.app, and force-push the
# result to the repo gregoire-maillard/dailyturkish (served by GitHub Pages).
# Never edit the dailyturkish repo by hand: it is overwritten on each sync.
name: Sync Turkish section to dailyturkish.app

on:
  push:
    branches: [main]
    paths:
      - "turkish*.html"
      - "assets/js/turkish*.js"
      - "assets/data/turkish/**"
      - "assets/fonts/**"
      - "assets/img/favicon.png"
      - "assets/img/daily-turkish-*"
      - "assets/img/ataturk.*"
      - "stylesheets/styles.css"
      - "scripts/turkish/static*.mjs"          # static.mjs and the page modules it imports (static-verbs, static-cheatsheet)
      - ".github/workflows/sync-dailyturkish.yml"
      - "LICENSE.txt"
  workflow_dispatch:

concurrency:
  group: sync-dailyturkish
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                          # full history, for each page's <lastmod>

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright (renders the pages for search engines)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Build the mirror
        run: |
          set -euo pipefail
          mkdir out
          for p in turkish.html turkishcards.html turkishguide.html turkishlesson.html turkishprivacy.html turkishculture.html turkishget.html \
                   assets/js/turkish.js assets/js/turkish-account.js assets/js/turkish-cast.js assets/js/turkish-getapp.js \
                   assets/img/daily-turkish-app-lesson.webp assets/img/daily-turkish-app-done.webp \
                   assets/data/turkish assets/fonts \
                   assets/img/favicon.png assets/img/ataturk.png assets/img/ataturk.webp \
                   assets/img/daily-turkish-favicon.svg assets/img/daily-turkish-favicon.png \
                   assets/img/daily-turkish-apple-touch-icon.png assets/img/daily-turkish-logo.svg \
                   stylesheets/styles.css LICENSE.txt; do
            if [ -e "$p" ]; then mkdir -p "out/$(dirname "$p")"; cp -R "$p" "out/$p"; fi
          done
          cp turkish.html out/index.html          # dailyturkish.app/ opens the course hub
          mkdir -p out/get && cp turkishget.html out/get/index.html   # dailyturkish.app/get/: the QR code's address (GETAPP-1)
          echo "dailyturkish.app" > out/CNAME
          touch out/.nojekyll                     # serve files exactly as they are

          # robots.txt of dailyturkish.app (the main site's own lists gregoiremaillard.com URLs).
          printf 'User-agent: *\nAllow: /\n\nSitemap: https://dailyturkish.app/sitemap.xml\n' > out/robots.txt

      - name: Pre-render the guides, the index and the hub; write sitemap.xml
        # A static page per guide (guides/<id>.html) and the content filled into turkishguide.html and the hub,
        # so search engines read it without JavaScript. Fails (and publishes nothing) if a page doesn't render.
        run: |
          node scripts/turkish/static.mjs out
          echo "Mirror contains $(find out -type f | wc -l) files"

      - name: Redirect the old Daily Turkmen addresses to dailyturkmen.app
        # Daily Turkmen moved to its own domain (sync-dailyturkmen.yml). Its main pages get a redirect page each;
        # any other /turkmen/... address (guides, verbs, word list) reaches 404.html, which sends it on, keeping the path.
        run: |
          set -euo pipefail
          mkdir -p out/turkmen
          for n in index guide cards lesson; do
            t="https://dailyturkmen.app/$n.html"; [ "$n" = index ] && t="https://dailyturkmen.app/"
            printf '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><title>Daily Turkmen has moved</title>\n<link rel="canonical" href="%s">\n<meta http-equiv="refresh" content="0; url=%s">\n<script>location.replace("%s" + location.search + location.hash)</script>\n</head><body><p>Daily Turkmen is now at <a href="%s">%s</a>.</p></body></html>\n' "$t" "$t" "$t" "$t" "$t" > "out/turkmen/$n.html"
          done
          grep -q '<head>' out/404.html
          sed -i '0,/<head>/s##<head>\n    <script>var p = location.pathname; if (p.indexOf("/turkmen/") === 0) location.replace("https://dailyturkmen.app/" + p.slice(9) + location.search + location.hash);</script>#' out/404.html
          grep -q 'dailyturkmen.app' out/404.html

      - name: Publish to gregoire-maillard/dailyturkish
        env:
          TOKEN: ${{ secrets.DAILYTURKISH_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b main
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mirror of gregoiremaillard.com Turkish section @ ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/gregoire-maillard/dailyturkish.git" main
