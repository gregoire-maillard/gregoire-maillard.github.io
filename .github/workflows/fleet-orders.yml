# Keeps the data behind /fleetorders.html fresh.
# Twice a month (after Airbus and Boeing publish the previous month's figures):
# read the previous snapshot from the `fleet-orders-data` branch, download the
# Airbus workbook, Boeing's Tableau export, and the Transport Canada and FAA
# registers, and publish the new snapshot back to `fleet-orders-data` as a
# single commit (the branch is overwritten each time, so it never grows).
# The website itself (main) is never touched, so GitHub Pages does not rebuild.
#
# If a source can't be downloaded from GitHub's servers, the previous figures are
# kept (and flagged on the page). The manual fallback is in scripts/fleet-orders/README.md.
name: Fleet orders

on:
  schedule:
    - cron: "17 7 14,22 * *"   # 14th and 22nd of each month, 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-orders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/fleet-orders
            assets/data/fleet-orders.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Get previous snapshot
        run: |
          mkdir -p prev out
          if git fetch --depth=1 origin fleet-orders-data && git show origin/fleet-orders-data:fleet-orders.json > prev/fleet-orders.json 2>/dev/null; then
            echo "Previous snapshot from fleet-orders-data."
          else
            echo "No fleet-orders-data branch yet: starting from the copy in the repo."
            cp assets/data/fleet-orders.json prev/fleet-orders.json
          fi

      - name: Update
        run: |
          node scripts/fleet-orders/update.mjs --inbox scripts/fleet-orders/inbox --prev prev/fleet-orders.json --out out/fleet-orders.json
          # nothing could be refreshed: republish the previous snapshot as is
          [ -f out/fleet-orders.json ] || cp prev/fleet-orders.json out/fleet-orders.json

      - name: Publish to fleet-orders-data branch
        run: |
          cd out
          printf '# Fleet orders snapshot\n\nGenerated by .github/workflows/fleet-orders.yml on main. Read by fleetorders.html.\nSources: Airbus Orders & Deliveries, Boeing Commercial Orders & Deliveries, Transport Canada CCAR, FAA Aircraft Registry.\n' > README.md
          git init -q -b fleet-orders-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Fleet orders snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fleet-orders-data
