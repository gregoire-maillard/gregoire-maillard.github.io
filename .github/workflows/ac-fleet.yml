# Keeps the data behind /acfleet.html fresh.
# Every ~5 minutes: read the previous snapshot from the `fleet-data` branch,
# ask adsb.lol where every Air Canada / Rouge / Express aircraft is, and
# publish the new snapshot back to `fleet-data` as a single commit (the branch
# is overwritten each time, so it never grows). The website itself (main) is
# never touched, so GitHub Pages does not rebuild.
name: AC fleet tracker

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may run it a few minutes late at busy times
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ac-fleet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ac-fleet

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Get previous snapshot
        run: |
          mkdir -p prev
          if git fetch --depth=1 origin fleet-data; then
            for f in status.json fleet.json airports.json; do
              git show "origin/fleet-data:$f" > "prev/$f" 2>/dev/null || rm -f "prev/$f"
            done
          else
            echo "No fleet-data branch yet — first run."
          fi

      - name: Update
        run: node scripts/ac-fleet/update.mjs prev out

      - name: Publish to fleet-data branch
        run: |
          cd out
          printf '# Air Canada fleet snapshot\n\nGenerated by .github/workflows/ac-fleet.yml on main. Read by acfleet.html.\nPositions: adsb.lol (ODbL). Fleet: Transport Canada CCAR. Airports: OurAirports.\n' > README.md
          git init -q -b fleet-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Fleet snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fleet-data
