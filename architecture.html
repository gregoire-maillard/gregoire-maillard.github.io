    <style>
      .board {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        margin: 6px 0 22px;
      }
      .polaroid {
        position: relative;
        background: #fdfdfa;
        border: 1px solid #ececec;
        padding: 10px 10px 10px;
        margin: 18px 16px;
        width: 175px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .polaroid::before {
        content: "";
        position: absolute;
        top: -9px;
        left: 50%;
        width: 54px;
        height: 18px;
        transform: translateX(-50%) rotate(-3deg);
        box-shadow: 0 1px 2px rgba(0,0,0,0.12);
      }
      .polaroid img {
        display: block;
        width: 100%;
        height: 160px;
        object-fit: cover;
      }
      .polaroid figcaption {
        font-family: 'Caveat', cursive;
        font-size: 17px;
        color: #666;
        text-align: center;
        padding-top: 6px;
        min-height: 20px;
        margin: 0;
      }
      .polaroid:hover {
        transform: rotate(0deg) scale(1.05);
        box-shadow: 0 10px 22px rgba(0,0,0,0.22);
        z-index: 5;
      }
      .rot-1 { transform: rotate(-4deg); margin-top: 4px; }
      .rot-1::before { background: rgba(255,214,102,.65); }
      .rot-2 { transform: rotate(3deg); margin-top: -6px; }
      .rot-2::before { background: rgba(255,179,186,.65); }
      .rot-3 { transform: rotate(-2deg); margin-top: 12px; }
      .rot-3::before { background: rgba(179,229,252,.65); }
      .rot-4 { transform: rotate(5deg); margin-top: -3px; }
      .rot-4::before { background: rgba(197,225,165,.65); }
      .rot-5 { transform: rotate(-6deg); margin-top: 9px; }
      .rot-5::before { background: rgba(255,214,102,.65); }
      .rot-6 { transform: rotate(2deg); margin-top: -2px; }
      .rot-6::before { background: rgba(179,229,252,.65); }

      body {
        padding: 30px 40px;
      }
      .wrapper {
        width: 100% !important;
        max-width: 1500px;
        margin: 0 auto !important;
        display: flex;
        align-items: flex-start;
        gap: 50px;
      }
      header {
        position: static !important;
        float: none !important;
        width: 240px !important;
        flex: 0 0 240px;
      }
      section {
        width: auto !important;
        float: none !important;
        flex: 1 1 auto;
      }
      footer {
        position: static !important;
        float: none !important;
        width: auto !important;
      }
      @media (max-width: 760px) {
        .wrapper {
          flex-direction: column;
          gap: 20px;
        }
        header {
          width: 100% !important;
          flex: 1 1 auto;
        }
      }
    </style>
