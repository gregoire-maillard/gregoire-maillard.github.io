    <style>
      /* This page opts out of the site's default fixed header/section columns
         in favor of a slim top bar (same pattern as food.html / book.html). */
      html, body {
        margin: 0;
        padding: 0;
      }

      .top-bar {
        padding: 18px 30px 14px;
        border-bottom: 1px solid #e5e5e5;
        background: #ffffff;
        box-sizing: border-box;
      }
      .top-bar h1 { margin: 0 0 6px; }
      .top-bar h1 a { color: #222; text-decoration: none; }
      .top-bar h1 a:hover { color: #39c; }
      .top-bar p {
        margin: 0;
        color: #595959;
        font-size: 0.92em;
        line-height: 1.5;
      }

      .content {
        max-width: 1600px;
        margin: 0 auto;
        padding: 20px 5% 60px;
        box-sizing: border-box;
      }
      .content hr {
        border: 0;
        border-top: 1px solid #e5e5e5;
        margin: 8px 0 34px;
      }

      /* ── Each city owns one accent color: its heading underline and
         every photo's tape strip in that section. ── */
      .city-block { margin-bottom: 6px; }
      .city-block h2 {
        display: inline-block;
        border-bottom: 4px solid var(--tape, #ddd);
        padding-bottom: 5px;
        margin-bottom: 14px;
      }

      /* ── Scrapbook boards ── */
      .board {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 20px;
        margin: 10px 0 4px;
      }
      .polaroid {
        position: relative;
        background: #fdfdfa;
        border: 1px solid #ececec;
        padding: 10px 10px 10px;
        margin: 0 0 18px;
        width: 250px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .polaroid::before {
        content: "";
        position: absolute;
        top: -9px;
        left: 50%;
        width: 68px;
        height: 22px;
        transform: translateX(-50%) rotate(-3deg);
        background: var(--tape, rgba(200,200,200,.6));
        box-shadow: 0 1px 2px rgba(0,0,0,0.12);
      }
      .polaroid img {
        display: block;
        width: 100%;
        height: 225px;
        object-fit: cover;
        cursor: zoom-in;
      }
      .polaroid figcaption {
        font-family: 'Caveat', cursive;
        font-size: 18px;
        color: #666;
        text-align: center;
        padding-top: 6px;
        min-height: 22px;
        margin: 0;
      }
      .polaroid:hover {
        transform: rotate(0deg) scale(1.05);
        box-shadow: 0 10px 22px rgba(0,0,0,0.22);
        z-index: 5;
      }
      .rot-1 { transform: rotate(-4deg); margin-top: 4px; }
      .rot-2 { transform: rotate(3deg); margin-top: -6px; }
      .rot-3 { transform: rotate(-2deg); margin-top: 12px; }
      .rot-4 { transform: rotate(5deg); margin-top: -3px; }
      .rot-5 { transform: rotate(-6deg); margin-top: 9px; }
      .rot-6 { transform: rotate(2deg); margin-top: -2px; }

      /* ── Lightbox ── */
      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 40px;
        box-sizing: border-box;
      }
      .lightbox.open { display: flex; }
      .lightbox img {
        max-width: 90vw;
        max-height: 85vh;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        border-radius: 2px;
      }
      .lightbox-close {
        position: absolute;
        top: 18px;
        right: 26px;
        color: #fff;
        font-size: 34px;
        line-height: 1;
        cursor: pointer;
        background: none;
        border: none;
        padding: 4px 10px;
      }
      .lightbox-close:hover { color: #ccc; }
      .lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        color: #fff;
        font-size: 42px;
        line-height: 1;
        cursor: pointer;
        background: none;
        border: none;
        padding: 10px 18px;
        user-select: none;
      }
      .lightbox-nav:hover { color: #ccc; }
      .lightbox-prev { left: 6px; }
      .lightbox-next { right: 6px; }

      @media (max-width: 700px) {
        .lightbox-nav { font-size: 30px; padding: 8px 12px; }
      }
    </style>

    <script src="javascripts/scale.fix.js"></script>
    <script>
      (function () {
        var imgs = Array.prototype.slice.call(document.querySelectorAll('.polaroid img'));
        var lightbox = document.getElementById('lightbox');
        var lightboxImg = document.getElementById('lightboxImg');
        var closeBtn = document.getElementById('lightboxClose');
        var prevBtn = document.getElementById('lightboxPrev');
        var nextBtn = document.getElementById('lightboxNext');
        var current = 0;

        function show(index) {
          current = (index + imgs.length) % imgs.length;
          lightboxImg.src = imgs[current].src;
          lightboxImg.alt = imgs[current].alt;
        }
        function open(index) {
          show(index);
          lightbox.classList.add('open');
        }
        function close() {
          lightbox.classList.remove('open');
        }

        imgs.forEach(function (img, i) {
          img.addEventListener('click', function () { open(i); });
        });

        closeBtn.addEventListener('click', close);
        prevBtn.addEventListener('click', function () { show(current - 1); });
        nextBtn.addEventListener('click', function () { show(current + 1); });
        lightbox.addEventListener('click', function (e) {
          if (e.target === lightbox) close();
        });
        document.addEventListener('keydown', function (e) {
          if (!lightbox.classList.contains('open')) return;
          if (e.key === 'Escape') close();
          if (e.key === 'ArrowLeft') show(current - 1);
          if (e.key === 'ArrowRight') show(current + 1);
        });
      })();
    </script>
